<!DOCTYPE html>    
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP - Senai</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        /* Estilos permanecem inalterados */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
            font-size: 0.9rem;
            color: #333;
        }
        header {
            background-color: #003366;
            color: white;
            padding: 16px 0;
            text-align: center;
            font-size: 1.8rem;
        }
        header h1 {
            display: inline-block;
        }
        .container {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            padding: 20px;
        }
        .module {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            width: 200px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        .module:hover {
            background-color: #f0f8ff;
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        .module i {
            font-size: 2rem;
            color: #003366;
        }
        .module h3 {
            font-size: 1.2rem;
            margin-top: 8px;
            font-weight: 600;
        }
        input[type="text"], input[type="password"], input[type="submit"], input[type="date"], input[type="number"], input[type="email"] {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 1rem;
        }
        input[type="submit"] {
            background-color: #003366;
            color: white;
            cursor: pointer;
            border: none;
            font-weight: bold;
        }
        input[type="submit"]:hover {
            background-color: #00509e;
        }
        table {
            width: 100%;
            margin-top: 16px;
            border-collapse: collapse;
            background-color: #fff;
        }
        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }
        th {
            background-color: #003366;
            color: white;
        }
        .form-group {
            margin-bottom: 12px;
        }
        #module-container {
            margin: 20px auto;
            width: 90%;
            max-width: 600px;
        }
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                align-items: center;
            }
            .module {
                width: 90%;
                margin-bottom: 16px;
            }
            .module i {
                font-size: 1.5rem;
            }
            .module h3 {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>

<!-- Login -->
<div id="login-screen">
    <header>
        <h1>ERP - Senai</h1>
    </header>
    <div class="container" style="justify-content: center;">
        <div class="module" style="width: 300px; text-align: center;">
            <h3>Login</h3>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">Usuário:</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Senha:</label>
                    <input type="password" id="password" required>
                </div>
                <input type="submit" value="Entrar">
                <p><a href="javascript:void(0)" onclick="showSignup()">Cadastrar-se</a></p>
            </form>
        </div>
    </div>
</div>

<!-- Tela de Cadastro -->
<div id="signup-screen" style="display: none;">
    <header>
        <h1>ERP - Senai</h1>
    </header>
    <div class="container" style="justify-content: center;">
        <div class="module" style="width: 300px; text-align: center;">
            <h3>Cadastrar Novo Usuário</h3>
            <form onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label for="new-username">Usuário:</label>
                    <input type="text" id="new-username" required>
                </div>
                <div class="form-group">
                    <label for="new-password">Senha:</label>
                    <input type="password" id="new-password" required>
                </div>
                <input type="submit" value="Cadastrar">
                <p><a href="javascript:void(0)" onclick="showLogin()">Já tem uma conta? Faça login</a></p>
            </form>
        </div>
    </div>
</div>

<!-- Tela principal -->
<div id="erp-screen" style="display: none;">
    <header>
        <h1>ERP - Senai</h1>
    </header>
    <div class="container">
        <div class="module" onclick="openModule('users')"><i class="fas fa-users"></i><h3>Usuários</h3></div>
        <div class="module" onclick="openModule('products')"><i class="fas fa-box"></i><h3>Produtos</h3></div>
        <div class="module" onclick="openModule('clients')"><i class="fas fa-user-friends"></i><h3>Clientes</h3></div>
        <div class="module" onclick="openModule('suppliers')"><i class="fas fa-truck"></i><h3>Fornecedores</h3></div>
        <div class="module" onclick="openModule('stock')"><i class="fas fa-warehouse"></i><h3>Estoques</h3></div>
        <div class="module" onclick="openModule('sales')"><i class="fas fa-cash-register"></i><h3>Vendas</h3></div>
        <div class="module" onclick="openModule('finance')"><i class="fas fa-dollar-sign"></i><h3>Financeiro</h3></div>
        <div class="module" onclick="openModule('accounting')"><i class="fas fa-balance-scale-left"></i><h3>Contabilidade</h3></div>
    </div>
    <div id="module-container"></div>
</div>

<script>
    let db;
    window.onload = async () => {
        const SQL = await initSqlJs({ locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}` });
        db = new SQL.Database();
        db.run(`
            CREATE TABLE IF NOT EXISTS users (id INTEGER PRIMARY KEY AUTOINCREMENT, username TEXT, password TEXT);
            CREATE TABLE IF NOT EXISTS products (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT, price REAL, quantity INTEGER);
            CREATE TABLE IF NOT EXISTS clients (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT, contact TEXT);
            CREATE TABLE IF NOT EXISTS suppliers (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT, contact TEXT);
            CREATE TABLE IF NOT EXISTS stock (id INTEGER PRIMARY KEY AUTOINCREMENT, product TEXT, quantity INTEGER);
            CREATE TABLE IF NOT EXISTS sales (id INTEGER PRIMARY KEY AUTOINCREMENT, client TEXT, product TEXT, quantity INTEGER, total REAL);
        `);
    };

    function handleLogin(event) {
        event.preventDefault();
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const user = db.exec("SELECT * FROM users WHERE username = ? AND password = ?", [username, password]);
        if (user.length > 0) {
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("erp-screen").style.display = "block";
        } else {
            alert("Usuário ou senha incorretos!");
        }
    }

    function showSignup() {
        document.getElementById("login-screen").style.display = "none";
        document.getElementById("signup-screen").style.display = "block";
    }

    function showLogin() {
        document.getElementById("signup-screen").style.display = "none";
        document.getElementById("login-screen").style.display = "block";
    }

    function handleSignup(event) {
        event.preventDefault();
        const newUsername = document.getElementById("new-username").value;
        const newPassword = document.getElementById("new-password").value;

        db.run("INSERT INTO users (username, password) VALUES (?, ?)", [newUsername, newPassword]);

        alert("Usuário cadastrado com sucesso! Você pode fazer login agora.");
        showLogin();
    }

    function openModule(moduleName) {
        const moduleContainer = document.getElementById('module-container');
        if (moduleName === "finance") {
            moduleContainer.innerHTML = "<h2>FINANCEIRO</h2><table id='finance-table'></table>";
            loadFinanceTable();
        } else {
            moduleContainer.innerHTML = getFormHTML(moduleName);
            loadTable(moduleName);
        }
    }

    function getFormHTML(module) {
        const fields = {
            users: ['name', 'password', 'email'],
            products: ['name', 'price', 'quantity'],
            clients: ['name', 'contact'],
            suppliers: ['name', 'contact'],
            stock: ['product', 'quantity'],
            sales: ['client', 'product', 'quantity', 'total', 'price']
        }[module];

        let form = `<h2>${module.toUpperCase()}</h2><form onsubmit="saveData(event, '${module}')">`;

        fields.forEach(f => {
            const type = (f === 'price' || f === 'quantity' || f === 'total') ? 'number' : 'text';
            form += `<div class="form-group"><label>${f === 'client' ? 'Cliente' : f}:</label><input type="${type}" name="${f}" id="${f}" required></div>`;
        });

        form += `<input type="submit" value="Salvar"></form><table id="${module}-table"></table>`;
        return form;
    }

    function saveData(e, module) {
        e.preventDefault();
        const inputs = e.target.querySelectorAll("input[name], select[name]");
        const columns = [...inputs].map(i => i.name);
        const values = [...inputs].map(i => i.value);

        if (module === "products") {
            const [name, price, quantity] = values;
            db.run("INSERT INTO products (name, price, quantity) VALUES (?, ?, ?)", [name, price, quantity]);
            db.run("INSERT INTO stock (product, quantity) VALUES (?, ?)", [name, quantity]);
        } else if (module === "sales") {
            const [client, product, qtySale, total, price] = values;
            const res = db.exec("SELECT * FROM stock WHERE product = ?", [product]);
            if (res.length > 0) {
                let currentQty = res[0].values[0][2];
                let newQty = currentQty - qtySale;
                db.run("UPDATE stock SET quantity = ? WHERE product = ?", [newQty, product]);
            } else {
                db.run("INSERT INTO stock (product, quantity) VALUES (?, ?)", [product, -qtySale]);
            }
            db.run("INSERT INTO sales (client, product, quantity, total) VALUES (?, ?, ?, ?)", [client, product, qtySale, total]);
        } else {
            db.run(`INSERT INTO ${module} (${columns.join(',')}) VALUES (${columns.map(() => '?').join(',')})`, values);
        }

        if (module === "finance") {
            loadFinanceTable();
        } else {
            loadTable(module);
        }

        e.target.reset();
    }

    function loadTable(module) {
        const table = db.exec(`SELECT * FROM ${module}`);
        const tableHTML = table[0]?.values.map(row => 
            `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>` 
        ).join('') || '';
        document.getElementById(`${module}-table`).innerHTML = 
            `<thead><tr>${table[0]?.columns.map(col => `<th>${col}</th>`).join('')}</tr></thead>` +
            `<tbody>${tableHTML}</tbody>`;
    }

    function loadFinanceTable() {
        const sales = db.exec("SELECT * FROM sales");
        const tableHTML = sales[0]?.values.map(row => 
            `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`
        ).join('') || '';
        document.getElementById("finance-table").innerHTML = 
            `<thead><tr>${sales[0]?.columns.map(col => `<th>${col}</th>`).join('')}</tr></thead>` +
            `<tbody>${tableHTML}</tbody>`;
    }
</script>

</body>
</html>
